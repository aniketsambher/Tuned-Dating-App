# Local development: Postgres plus the API built from the Dockerfile.
#   docker compose up -d db          # just the database, then `npm run dev`
#   docker compose up --build        # database + API container
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: tuned
      POSTGRES_PASSWORD: tuned
      POSTGRES_DB: tuned
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuned"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://tuned:tuned@db:5432/tuned
      RUN_MIGRATIONS: "true"
      NODE_ENV: development
    ports:
      - "3000:3000"

volumes:
  pgdata:
